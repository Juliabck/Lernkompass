<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LernKompass – Mathe Klasse 3</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#193344;background:#f3f7f9}*{box-sizing:border-box}body{margin:0}header{background:#126d80;color:white;padding:22px max(18px,calc((100vw - 1050px)/2))}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;color:#d5f2f5}.wrap{max-width:1050px;margin:22px auto;padding:0 16px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}button,.btn{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#126d80;color:#fff;font-weight:650;font-size:14px}button:hover{filter:brightness(.94)}button.secondary{background:#e5eff3;color:#17475a}button.danger{background:#a73434}nav button{background:white;color:#225265;border:1px solid #d8e6ea}nav button.active{background:#126d80;color:white}.panel{background:white;border:1px solid #dce8ed;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 4px 20px #1e53600a}h2{margin:0 0 12px;font-size:22px}h3{margin:16px 0 10px}p{line-height:1.55}small,.muted{color:#627783}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#eaf3f5;border-radius:12px;padding:16px}.stat strong{display:block;font-size:28px;color:#126d80}label{display:block;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #bdd0d8;border-radius:9px;padding:12px;font:inherit;background:white;color:#193344}input[type=number]{max-width:160px}.task{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf1f4}.task input{width:130px}.task span{font-size:18px;font-weight:600}.notice{background:#fff6e6;border-left:4px solid #df9a27;padding:12px 14px;border-radius:7px}.good{background:#e8f5ed;border-left:4px solid #3a9a63;padding:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pill{background:#e9f2f5;border-radius:30px;padding:6px 11px;font-size:13px}.hidden{display:none}.chart{width:100%;height:auto;max-height:340px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e5edf0}th{background:#f1f7f8}details{border:1px solid #dae6ea;border-radius:10px;padding:12px;margin:9px 0}summary{cursor:pointer;font-weight:700}footer{padding:25px;text-align:center;color:#617986;font-size:12px}@media print{header,nav,button,.no-print{display:none!important}.panel{box-shadow:none;break-inside:avoid}body{background:white}}@media(max-width:550px){.task input{width:95px}.panel{padding:15px}}
</style></head><body><header><h1>📈 LernKompass</h1><p>Mathematik · Grundschule Klasse 3 · Baden-Württemberg · Demonstrationsprototyp</p></header><main class="wrap"><nav id="nav"><button data-tab="start" class="active">Übersicht</button><button data-tab="test">Test durchführen</button><button data-tab="results">Lernverlauf</button><button data-tab="docs">Dokumentation</button></nav><div id="view"></div></main><footer>Nur fiktive Demonstrationsdaten · Kein normierter oder validierter Diagnostiktest · Lokal im Browser</footer><script>
'use strict';const KEY='lernkompass_v1';const NAMES=['Mia (Demo)','Ben (Demo)','Lina (Demo)'];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.students))state={students:NAMES.map(name=>({name,results:[]})),selected:0};let tab='start',activeTest=null,timer=null,seconds=600;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function current(){return state.students[state.selected]}function results(){return current().results.slice().sort((a,b)=>a.form-b.form)}function done(form){return current().results.some(r=>r.form===form)}function navigate(t){if(activeTest&&t!=='test'&&!confirm('Laufenden Test verlassen? Nicht abgegebene Antworten gehen verloren.'))return;if(activeTest&&t!=='test')stopTimer();tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));function studentPicker(){return `<label for="student">Fiktives Kind</label><select id="student" onchange="chooseStudent(this.value)">${state.students.map((s,i)=>`<option value="${i}" ${i===state.selected?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`}window.chooseStudent=function(i){state.selected=Number(i);save();render()};function rng(seed){let x=seed>>>0;return()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296}}function formTasks(form){const rand=rng(1053+form*719);let tasks=[];const between=(a,b)=>a+Math.floor(rand()*(b-a+1));for(let i=0;i<5;i++){let a=between(110,470),b=between(110,430);if(a+b>999)b=999-a;tasks.push({kind:'Addition',q:`${a} + ${b}`,a:a+b})}for(let i=0;i<5;i++){let a=between(350,950),b=between(120,Math.min(430,a-30));tasks.push({kind:'Subtraktion',q:`${a} − ${b}`,a:a-b})}for(let i=0;i<5;i++){let a=between(3,9),b=between(3,9);tasks.push({kind:'Multiplikation',q:`${a} × ${b}`,a:a*b})}for(let i=0;i<5;i++){let a=between(3,9),b=between(3,9);tasks.push({kind:'Division',q:`${a*b} ÷ ${a}`,a:b})}return tasks}function overview(){const s=current(),r=results();$('view').innerHTML=`<section class="panel"><h2>Willkommen zur Lernverlaufsdiagnostik</h2><p>Eine schulpraktische Demonstration: <b>8 kurze Testformen</b> mit jeweils <b>20 Aufgaben</b>, vorgesehen im Abstand von etwa <b>3 Wochen</b>. Die App misst in dieser Version ausschließlich rechnerische Ergebnisrichtigkeit.</p><div class="notice"><b>Wissenschaftlicher Hinweis:</b> Die Formen folgen derselben Aufgabenstruktur, sind aber nicht empirisch auf gleiche Schwierigkeit geprüft. Die Ergebnisse sind <b>keine normierten Diagnosen</b>.</div>${studentPicker()}</section><section class="grid"><div class="stat"><strong>${r.length}/8</strong>Messzeitpunkte</div><div class="stat"><strong>${r.length?r[r.length-1].score+'/20':'–'}</strong>Letztes Ergebnis</div><div class="stat"><strong>${r.length?Math.round(r.reduce((a,b)=>a+b.score,0)/r.length*5)+' %':'–'}</strong>Durchschnitt richtig</div></section><section class="panel"><h2>Was möchtest du tun?</h2><div class="row"><button onclick="navigate('test')">Test starten</button><button class="secondary" onclick="navigate('results')">Lernverlauf ansehen</button><button class="secondary" onclick="seedDemo()">Fiktive Beispieldaten einfügen</button></div><p class="muted">Die Beispieldaten können jederzeit zurückgesetzt werden. Daten bleiben nur in diesem Browser gespeichert, solange der Browserspeicher erhalten bleibt.</p></section>`}function testPage(){if(activeTest){const tasks=activeTest.tasks;$('view').innerHTML=`<section class="panel"><div class="row" style="justify-content:space-between"><h2>Test ${activeTest.form} von 8</h2><span class="pill" id="clock">10:00</span></div><p>Berechne die Ergebnisse. Trage zu jeder Aufgabe eine Zahl ein. Nicht beantwortete Aufgaben zählen als nicht richtig.</p><form id="testForm" onsubmit="finishTest(event)">${tasks.map((t,i)=>`<div class="task"><span>${i+1}. ${esc(t.q)} =</span><input aria-label="Antwort Aufgabe ${i+1}" inputmode="numeric" type="number" step="1" name="a${i}" autocomplete="off"></div>`).join('')}<p><button type="submit">Test abgeben und auswerten</button></p></form></section>`;updateClock();return}const opts=Array.from({length:8},(_,i)=>`<option value="${i+1}" ${done(i+1)?'disabled':''}>Test ${i+1}${done(i+1)?' – bereits abgeschlossen':''}</option>`).join('');$('view').innerHTML=`<section class="panel"><h2>Test durchführen</h2>${studentPicker()}<label for="form">Messzeitpunkt</label><select id="form">${opts}</select><p>Jede Testform enthält 5 Additions-, 5 Subtraktions-, 5 Multiplikations- und 5 Divisionsaufgaben. Der Timer beträgt 10 Minuten; bei Ablauf erfolgt die automatische Abgabe.</p><div class="notice">Für eine faire Durchführung: gleiche Zeit, gleiche Instruktion, gleiche erlaubte Hilfsmittel und möglichst ähnliche Bedingungen. Ein Wiederholen derselben Form ist im Prototyp nicht vorgesehen.</div><p><button onclick="beginTest()" ${results().length===8?'disabled':''}>Test beginnen</button></p></section>`}window.beginTest=function(){let f=Number($('form').value);if(!f||done(f))return;activeTest={form:f,tasks:formTasks(f),started:new Date().toISOString()};seconds=600;render();timer=setInterval(()=>{seconds--;updateClock();if(seconds<=0)finishTest()},1000)};function updateClock(){const e=$('clock');if(e)e.textContent=`${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`}function stopTimer(){if(timer)clearInterval(timer);timer=null;activeTest=null}window.finishTest=function(ev){if(ev)ev.preventDefault();if(!activeTest)return;const form=$('testForm'),answers=activeTest.tasks.map((t,i)=>{const val=form?.elements['a'+i]?.value;return val===''||val===undefined?null:Number(val)});let score=0;const breakdown={};activeTest.tasks.forEach((t,i)=>{if(!(t.kind in breakdown))breakdown[t.kind]={correct:0,total:0};breakdown[t.kind].total++;if(answers[i]===t.a){score++;breakdown[t.kind].correct++}});const f=activeTest.form;current().results.push({form:f,date:new Date().toISOString(),score,breakdown,answers,elapsed:600-seconds,source:'test'});save();stopTimer();tab='results';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();alert(`Test ${f} ausgewertet: ${score} von 20 Aufgaben richtig.`)};function chartSVG(r,kind){let w=760,h=270,left=52,right=25,top=20,bottom=42,plotW=w-left-right,plotH=h-top-bottom,max=kind?5:20;const X=f=>left+(f-1)*plotW/7,Y=v=>top+(max-v)*plotH/max;let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Lernverlauf ${esc(kind||'Gesamt')}: Punkte über acht Tests">`;for(let v=0;v<=max;v+=(kind?1:5))s+=`<line x1="${left}" y1="${Y(v)}" x2="${w-right}" y2="${Y(v)}" stroke="#dce7ec"/><text x="${left-10}" y="${Y(v)+4}" text-anchor="end" font-size="13" fill="#637987">${v}</text>`;for(let f=1;f<=8;f++)s+=`<text x="${X(f)}" y="${h-12}" text-anchor="middle" font-size="13" fill="#637987">T${f}</text>`;const sorted=r.slice().sort((a,b)=>a.form-b.form),val=x=>kind?(x.breakdown?.[kind]?.correct??0):x.score;if(sorted.length){s+=`<polyline fill="none" stroke="#126d80" stroke-width="3" points="${sorted.map(a=>`${X(a.form)},${Y(val(a))}`).join(' ')}"/>`;for(let a of sorted)s+=`<circle cx="${X(a.form)}" cy="${Y(val(a))}" r="6" fill="${a.source==='demo'?'#e38b2c':'#126d80'}"><title>Test ${a.form}: ${val(a)} von ${max}</title></circle>`}return s+'</svg>'}function resultPage(){let r=results(),latest=r[r.length-1],kinds=['Addition','Subtraktion','Multiplikation','Division'];let sections=kinds.map(kind=>{const vals=r.map(x=>x.breakdown?.[kind]?.correct??0),last=vals.at(-1),prev=vals.at(-2);const note=vals.length<2?'Noch kein Vergleich möglich.':last>prev?'Zuletzt verbessert – weiter beobachten.':last===prev?'Zuletzt unverändert – Rechenstrategien und Fehler prüfen.':'Zuletzt niedriger – Ursachen und Aufgaben genauer prüfen.';return `<section class="panel"><h2>${kind}</h2><p><b>${last===undefined?'–':last+' von 5'}</b> Aufgaben im letzten Test richtig</p>${chartSVG(r,kind)}<p class="muted">${note} Die Testformen sind nicht empirisch gleichgesetzt.</p></section>`}).join('');let table=r.map(x=>`<tr><td>T${x.form}</td><td>${new Date(x.date).toLocaleDateString('de-DE')}</td>${kinds.map(k=>`<td>${x.breakdown?.[k]?.correct??'–'}/5</td>`).join('')}<td><b>${x.score}/20</b></td></tr>`).join('');$('view').innerHTML=`<section class="panel"><h2>Deine Entwicklung – Schritt für Schritt</h2>${studentPicker()}<p>Hier siehst du <b>jede Rechenart einzeln</b>. Nach jedem Test wird der passende Lernverlauf ergänzt. So erkennst du, was schon gut klappt und wo du noch üben kannst.</p><div class="notice">Demo mit fiktiven Kindern. Die Ergebnisse zeigen nur die Richtigkeit der Aufgaben, keine gesicherte Diagnose.</div></section>${sections}<section class="panel"><details><summary>Gesamtergebnis zusätzlich anzeigen</summary>${chartSVG(r,null)}</details><h2>Alle Messzeitpunkte</h2><div class="tablewrap"><table><thead><tr><th>Test</th><th>Datum</th>${kinds.map(k=>`<th>${k}</th>`).join('')}<th>Gesamt</th></tr></thead><tbody>${table||'<tr><td colspan="7">Noch keine Ergebnisse vorhanden.</td></tr>'}</tbody></table></div><p class="muted">Orange Punkte: fiktive Beispieldaten; türkis: im Browser durchgeführte Tests. Die acht Testformen sind nicht hinsichtlich Schwierigkeit, Reliabilität oder Änderungssensitivität validiert.</p><div class="row"><button class="secondary" onclick="downloadCSV()">CSV exportieren</button><button class="secondary" onclick="downloadJSON()">JSON sichern</button><button class="secondary" onclick="window.print()">Drucken / PDF</button><button class="danger" onclick="clearStudent()">Ergebnisse löschen</button></div></section>`}window.seedDemo=function(){if(!confirm('Fiktive Beispieldaten für alle drei Demo-Kinder einsetzen? Vorhandene Ergebnisse werden dabei ersetzt.'))return;const series=[[6,8,9,9,12,14,16,18],[11,11,12,13,12,14,15,15],[4,5,7,8,8,9,11,12]];state.students.forEach((s,idx)=>{s.results=series[idx].map((score,i)=>{let breakdown={},remain=score;for(const k of ['Addition','Subtraktion','Multiplikation','Division']){let idx=['Addition','Subtraktion','Multiplikation','Division'].indexOf(k);let correct=Math.floor(score/4)+(idx<(score%4)?1:0);breakdown[k]={correct,total:5};remain-=correct}return{form:i+1,date:new Date(Date.now()-(7-i)*21*86400000).toISOString(),score,breakdown,source:'demo',elapsed:600}})});save();render()};window.clearStudent=function(){if(!confirm('Alle Ergebnisse des ausgewählten fiktiven Kindes wirklich löschen?'))return;current().results=[];save();render()};function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}window.downloadCSV=function(){let rows=[['Kind','Test','Datum','Richtig','Gesamt','Datenart'],...state.students.flatMap(s=>s.results.map(r=>[s.name,r.form,r.date,r.score,20,r.source]))];download('lernkompass_ergebnisse.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')};window.downloadJSON=function(){download('lernkompass_sicherung.json',JSON.stringify(state,null,2),'application/json')};function docsPage(){$('view').innerHTML=`<section class="panel"><h2>Dokumentation der Entwicklung</h2><p><b>Auftrag:</b> Eine mit KI unterstützte Lernverlaufsdiagnostik für Mathematik Klasse 3 erstellen, Vorgehensweise dokumentieren und Eignung kritisch bewerten.</p><details open><summary>1. Fachliche Grundlage</summary><p>Orientierung am Bildungsplan Mathematik Grundschule Baden-Württemberg, 2016 in der Fassung vom 29.02.2024 (V2), Standards Klassen 3/4: insbesondere <b>3.2.1.2 Rechenoperationen verstehen und beherrschen</b>. Der Plan beschreibt Kompetenzen für Klasse 3/4 gemeinsam; die Eingrenzung auf Zahlen bis 1.000 ist eine didaktische Entscheidung für diesen Prototyp und keine vollständige Wiedergabe der Standards.</p><p><a href="https://www.bildungsplaene-bw.de/%2CLde/LS/BP2016BW/ALLG/GS/M.V2/IK/3-4/01/02" target="_blank" rel="noopener">Offizielle Bildungsplanquelle</a></p></details><details open><summary>2. Vorgehensweise mit KI</summary><ol><li>Aufgabenstellung und Gütekriterien aus den Lehrveranstaltungsfolien ausgewertet.</li><li>Den offiziellen Bildungsplan als Kompetenzgrundlage herangezogen.</li><li>Den messbaren Teilbereich Rechenrichtigkeit bei vier Grundrechenarten ausgewählt.</li><li>Acht reproduzierbare Testformen mit je 20 Aufgaben programmiert.</li><li>Einheitliche Zeit (10 Minuten), Eingabemaske und automatische Auswertung umgesetzt.</li><li>Verlaufsdarstellung, CSV-/JSON-Export und fiktive Datensätze ergänzt.</li><li>Grenzen der psychometrischen Testgüte und des Datenschutzes reflektiert.</li></ol></details><details open><summary>3. Testdesign</summary><p>Je Testform: 5 Additionen, 5 Subtraktionen im Zahlenraum bis 1.000, 5 Aufgaben des kleinen Einmaleins und 5 zugehörige Divisionsaufgaben. Ein Punkt je korrekter Zahleneingabe; maximal 20 Punkte. Keine Teilpunkte. Wiederholung idealerweise etwa alle drei Wochen, insgesamt acht Messzeitpunkte. Die Formen verwenden unterschiedliche, deterministisch erzeugte Aufgaben.</p><p>Die Anwendung erfasst weder Rechenwege noch Strategien, mathematisches Argumentieren, Modellieren oder den gesamten Mathematikbildungsplan.</p></details><details open><summary>4. Bewertung nach den Folien</summary><table><thead><tr><th>Kriterium</th><th>Einordnung</th></tr></thead><tbody><tr><td>Kurz / Ökonomisch</td><td>10 Minuten, automatische Bewertung – technisch umgesetzt</td></tr><tr><td>Häufig</td><td>Acht Formen vorhanden; Durchführung im Dreiwochenrhythmus durch Lehrkraft zu organisieren</td></tr><tr><td>Vergleichbar / Parallelformen</td><td>Gleiche Aufgabenanzahl und Rechenarten; statistische Gleichwertigkeit nicht belegt</td></tr><tr><td>Sichtbar</td><td>Lernverlauf als Grafik – umgesetzt</td></tr><tr><td>Objektivität</td><td>Automatische Bewertung; Durchführungsbedingungen müssen standardisiert werden</td></tr><tr><td>Reliabilität</td><td>Nicht empirisch untersucht</td></tr><tr><td>Validität</td><td>Inhaltlich begrenzte Rechenprobe, keine Validierungsstudie</td></tr><tr><td>Änderungssensitivität</td><td>Nicht nachgewiesen; Schwankungen können andere Ursachen haben</td></tr></tbody></table></details><details open><summary>5. Pädagogischer Transfer</summary><p>Die Lehrkraft betrachtet nicht nur die Punktzahl, sondern überprüft bei Stagnation die Fehlerarten, beobachtet Rechenstrategien, passt die Förderung an und misst erneut. Ein einzelner Messwert darf nicht zur Etikettierung eines Kindes genutzt werden. Ergebnisse können in verständlicher Form mit Kind und Eltern besprochen werden.</p></details><details open><summary>6. Datenschutz und Einschränkungen</summary><p>Es werden ausschließlich fiktive Namen verwendet. Die Daten werden lokal im Browser (localStorage) gespeichert und nicht an einen Server gesendet. Browserdaten können gelöscht werden; auf gemeinsam genutzten Geräten sind sie nicht ausreichend geschützt. <b>Für reale personenbezogene Schülerdaten ist diese Demo nicht freigegeben.</b> Vor schulischem Einsatz wären Datenschutzkonzept, Zugriffsschutz, Löschfristen, schulische Freigabe und fachliche Validierung notwendig.</p></details><div class="row"><button class="secondary" onclick="window.print()">Dokumentation drucken / PDF</button></div></section>`}function render(){if(tab==='start')overview();else if(tab==='test')testPage();else if(tab==='results')resultPage();else docsPage()}render();</script></body></html>
